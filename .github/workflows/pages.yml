name: Deploy Wiiew PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static PWA
        run: |
          rm -rf _site
          mkdir -p _site/icons
          cp wiiew/frontend/pages-index.html _site/index.html
          cp wiiew/frontend/pages-style.css _site/style.css
          cp wiiew/frontend/pages-app.js _site/app.js
          cp wiiew/frontend/pages-manifest.json _site/manifest.json
          cp wiiew/frontend/pages-sw.js _site/sw.js
          cp wiiew/frontend/icons/icon.svg _site/icons/icon.svg
          cp wiiew/frontend/icons/icon-192.png _site/icons/icon-192.png
          cp wiiew/frontend/icons/icon-512.png _site/icons/icon-512.png
          cp wiiew/frontend/icons/maskable-icon-512.png _site/icons/maskable-icon-512.png
          cp wiiew/frontend/icons/badge-72.png _site/icons/badge-72.png
          touch _site/.nojekyll

      - name: Verify assembled assets
        run: |
          test -s _site/index.html
          test -s _site/style.css
          test -s _site/app.js
          test -s _site/manifest.json
          test -s _site/sw.js
          grep -q './style.css' _site/index.html
          grep -q './app.js' _site/index.html
          echo 'Wiiew Pages assets verified.'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
